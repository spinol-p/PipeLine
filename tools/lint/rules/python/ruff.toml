# Reglas base de buenas prácticas Python del pipeline de revisión.
# Se aplican SOLO cuando el servicio no declara su propia configuración de Ruff
# (ruff.toml, .ruff.toml o [tool.ruff] en pyproject.toml). Si la declara, manda la del servicio.

line-length = 120
extend-exclude = [
    ".venv", "venv", "build", "dist", "migrations",
    "**/*_pb2.py", "**/*_pb2_grpc.py", "**/*_pb2.pyi",
]

[lint]
select = [
    "E", "W",   # pycodestyle: errores y advertencias de estilo PEP 8
    "F",        # pyflakes: nombres sin definir, imports sin usar, variables muertas
    "I",        # isort: orden de imports
    "N",        # pep8-naming: convenciones de nombres
    "UP",       # pyupgrade: sintaxis moderna para la versión de Python objetivo
    "B",        # flake8-bugbear: errores de diseño frecuentes (defaults mutables, etc.)
    "S",        # flake8-bandit: seguridad
    "A",        # sombrear builtins (id, type, list...)
    "C4",       # comprensiones correctas
    "SIM",      # simplificaciones
    "RET",      # returns consistentes
    "PIE",      # construcciones innecesarias
    "BLE",      # except Exception genérico que se traga errores
    "DTZ",      # datetimes sin zona horaria
    "G",        # logging con f-strings o format
    "LOG",      # uso correcto del módulo logging
    "ASYNC",    # bloqueos dentro de código async
    "RUF",      # reglas propias de Ruff
]
ignore = [
    "E501",     # largo de línea: lo resuelve el formateador
    "B008",     # llamadas en defaults: patrón habitual de FastAPI (Depends, Query)
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"**/test_*.py" = ["S101", "S105", "S106", "S311"]
"**/*_test.py" = ["S101", "S105", "S106", "S311"]
"**/conftest.py" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
